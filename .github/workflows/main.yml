
name: Build Prompt Refiner APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate and verify debug keystore
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt
          test -f "$GITHUB_WORKSPACE/debug.keystore"
          ls -l "$GITHUB_WORKSPACE/debug.keystore"

      - name: Build debug APK
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-refiner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
