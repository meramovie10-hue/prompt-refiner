
name: Build Prompt Refiner APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify project files
        run: |
          set -eu
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $(git rev-parse HEAD)"
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          echo "Project files verified."

      - name: Generate debug keystore
        run: |
          set -eu
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

          test -f "$GITHUB_WORKSPACE/debug.keystore"
          echo "Debug keystore created successfully."

      - name: Diagnose debug signing configuration
        run: |
          echo "Checking Gradle files for debugConfig..."
          grep -R -n \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            --exclude-dir=.git \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            'debugConfig' . || true

          echo "Checking app/build.gradle.kts debug block..."
          grep -n -A 12 -B 5 'debug {' \
            app/build.gradle.kts || true

          echo "Checking generated keystore..."
          ls -l "$GITHUB_WORKSPACE/debug.keystore"

      - name: Build debug APK
        run: |
          gradle assembleDebug \
            --no-configuration-cache \
            --rerun-tasks

      - name: Verify APK
        run: |
          set -eu
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          ls -lh "$APK"
          echo "APK build completed successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prompt-refiner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
